<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>copytourl</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#24354a;font:14px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:24px auto;padding:0 14px}
section{padding:14px;background:#fff;border:1px solid #dde4eb;border-radius:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{margin:0;font-size:18px}label{display:block;margin-bottom:6px}
textarea{display:block;width:100%;resize:vertical;border:1px solid #cbd6e2;border-radius:5px;padding:10px;font:14px/1.6 system-ui,sans-serif;color:inherit;background:#fff}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2463b7;outline-offset:2px}
button,a.button{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:3px 8px;border:1px solid #ccd8e5;border-radius:5px;background:#f5f8fc;color:#235fae;font:12px/20px system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.primary{background:#2463b7;color:#fff;border-color:#2463b7}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
small{font-size:12px;color:#65768a}
#result{margin-top:14px}#link{font-size:12px}
#received{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.7 system-ui,sans-serif}
.error{color:#a12d3e;margin:10px 0 0;font-size:13px}
#copy-status{font-size:12px;color:#65768a}#copy-status:empty{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="composer">
<header><h1>copytourl</h1><a id="download-html" class="button" download="copytourl.html">HTML 받기</a></header>
<form id="form">
<label for="text">공유할 텍스트</label>
<textarea id="text" rows="10" placeholder="텍스트를 입력하세요." spellcheck="false"></textarea>
<div class="tools"><button id="make-link" class="primary" type="submit">링크 만들기</button><small>링크를 가진 사람은 내용을 볼 수 있어요.</small></div>
<p id="form-error" class="error" role="alert" hidden></p>
</form>
<div id="result" hidden>
<label for="link">공유 링크</label>
<textarea id="link" rows="3" readonly spellcheck="false"></textarea>
<div class="tools"><button id="copy-link" class="primary" type="button">링크 복사</button><a id="preview" class="button">열어보기</a><small id="link-size" role="status"></small></div>
<small id="length-note" hidden>긴 링크는 메신저에서 잘릴 수 있어요. 받은 링크가 끝까지 전달됐는지 확인해 주세요.</small>
</div>
</section>
<section id="viewer" hidden>
<header><h1>copytourl</h1><button id="copy-text" class="primary" type="button">복사</button></header>
<pre id="received"></pre>
<small id="legacy-note" hidden>이전 형식의 링크예요. 사이트가 종료되어도 원문을 복원할 수 있어요.</small>
</section>
<section id="invalid" hidden>
<p id="invalid-message" class="error" role="alert"></p>
<div class="tools"><a class="button" href="./">새 링크 만들기</a></div>
</section>
<p id="copy-status" role="status" aria-live="polite"></p>
<p id="loading" role="status" hidden>여는 중…</p>
</main>

<script id="app">
(() => {
  const BASE = "https://copytourl.github.io/copytourl/";
  const RECIPIENT = {"kid":"ef1853219c7df7da","jwk":{"kty":"EC","x":"UDLxJIEAUi9pOB4AOHKMG8fCn_qtz1cEHD9dUvGwlOg","y":"nBh-MMkowZBtiVvwwS6atMTN5TtRPJJDGAJ_2hcer5U","crv":"P-256"}};

  const el = id => document.getElementById(id);
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', {fatal:true, ignoreBOM:true});
  let received = '', noticeTimer;
  let renderRevision = 0, inputRevision = 0;
  el('download-html').href = BASE + 'copytourl.html';
  el('download-html').hidden = location.protocol === 'file:';

  function textBytes(text) {
    if (text.length > MAX_BYTES) throw Error('텍스트는 1 MB까지 사용할 수 있어요.');
    const bytes = encoder.encode(text);
    if (!text.trim()) throw Error('텍스트를 입력해 주세요.');

  }

    let binary = '';

    }

  }

    const binary = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));

    const hash = location.hash;
    received = '';
    el('received').textContent = '';
    el('copy-status').textContent = '';
    el('composer').hidden = !!hash;
    el('viewer').hidden = true;
    el('invalid').hidden = true;
    el('loading').hidden = true;
    el('legacy-note').hidden = true;

    el('loading').hidden = false;

})();
