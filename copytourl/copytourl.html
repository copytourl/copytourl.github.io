<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; worker-src blob:; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>copytourl</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#24354a;font:14px/1.6 system-ui,sans-serif}
main{max-width:760px;margin:24px auto;padding:0 14px}
section{padding:14px;background:#fff;border:1px solid #dde4eb;border-radius:8px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{margin:0;font-size:18px}label{display:block;margin-bottom:6px}
textarea{display:block;width:100%;resize:vertical;border:1px solid #cbd6e2;border-radius:5px;padding:10px;font:14px/1.6 system-ui,sans-serif;color:inherit;background:#fff}
textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2463b7;outline-offset:2px}
button,a.button{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:3px 8px;border:1px solid #ccd8e5;border-radius:5px;background:#f5f8fc;color:#235fae;font:12px/20px system-ui,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap}
.primary{background:#2463b7;color:#fff;border-color:#2463b7}
.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px}
small{font-size:12px;color:#65768a}
#result{margin-top:14px}#link{font-size:12px}
#received{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.7 system-ui,sans-serif}
.error{color:#a12d3e;margin:10px 0 0;font-size:13px}
#copy-status{font-size:12px;color:#65768a}#copy-status:empty{display:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="composer">
<header><h1>copytourl</h1><a id="download-html" class="button" download="copytourl.html">HTML 받기</a></header>
<form id="form">
<label for="text">공유할 텍스트</label>
<textarea id="text" rows="10" placeholder="텍스트를 입력하세요." spellcheck="false"></textarea>
<div class="tools"><button id="make-link" class="primary" type="submit">링크 만들기</button><small>링크를 가진 사람은 내용을 볼 수 있어요.</small></div>
<p id="form-error" class="error" role="alert" hidden></p>
</form>
<div id="result" hidden>
<label for="link">공유 링크</label>
<textarea id="link" rows="3" readonly spellcheck="false"></textarea>
<div class="tools"><button id="copy-link" class="primary" type="button">링크 복사</button><a id="preview" class="button">열어보기</a><small id="link-size" role="status"></small></div>
<small id="length-note" hidden>긴 링크는 메신저에서 잘릴 수 있어요. 받은 링크가 끝까지 전달됐는지 확인해 주세요.</small>
</div>
</section>
<section id="viewer" hidden>
<header><h1>copytourl</h1><button id="copy-text" class="primary" type="button">복사</button></header>
<pre id="received"></pre>
</section>
<section id="invalid" hidden>
<p id="invalid-message" class="error" role="alert"></p>
<div class="tools"><a class="button" href="./">새 링크 만들기</a></div>
</section>
<p id="copy-status" role="status" aria-live="polite"></p>
<p id="loading" role="status" hidden>여는 중…</p>
</main>

<script id="codec-library">/* Lossless URL formats: t/u = UTF-8/UTF-16LE, d/f = raw DEFLATE,
   b/c = Brotli. z remains compatible with earlier zlib links. */
var CopytourlCodec = (() => {
  const MAX_BYTES = 1048576;
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', {fatal:true, ignoreBOM:true});
  const decoder16 = new TextDecoder('utf-16le', {fatal:true, ignoreBOM:true});
  let ready;

  function textBytes(text) {
    if (text.length > MAX_BYTES) throw Error('텍스트는 1 MB까지 사용할 수 있어요.');
    const bytes = encoder.encode(text);
    if (!text.trim()) throw Error('텍스트를 입력해 주세요.');
    if (bytes.length > MAX_BYTES) throw Error('텍스트는 1 MB까지 사용할 수 있어요.');
    if (decoder.decode(bytes) !== text) throw Error('텍스트의 문자를 확인해 주세요.');
    return bytes;
  }

  function toBase64url(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192) {
      binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
    }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fromBase64url(payload) {
    if (!/^[A-Za-z0-9_-]+$/.test(payload)) throw Error('Invalid encoding');
    const binary = atob(payload.replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
    if (toBase64url(bytes) !== payload) throw Error('Invalid encoding');
    return bytes;
  }

  function utf16(text) {
    const bytes = new Uint8Array(text.length * 2);
    const view = new DataView(bytes.buffer);
    for (let i = 0; i < text.length; i++) view.setUint16(i * 2, text.charCodeAt(i), true);
    return bytes;
  }

  function join(chunks, size) {
    const bytes = new Uint8Array(size);
    let offset = 0;
    for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
    return bytes;
  }

  function inflate(bytes, limit = MAX_BYTES) {
    const chunks = [];
    let size = 0;
    const stream = new CopytourlCompression.Inflate(chunk => {
      size += chunk.length;
      if (size > limit) throw Error('Too much text');
      chunks.push(chunk);
    });
    // Bound transient expansion before checking the total output.
    for (let i = 0; i < bytes.length; i += 256) {
      stream.push(bytes.subarray(i, i + 256), i + 256 >= bytes.length);
    }
    // fflate 0.8.3 keeps unconsumed bytes and the final-block state here.
    // Require a completed stream without extra bytes; cover this in verify.mjs.
    if (!stream.s.f || stream.s.l || stream.p.length !== Math.ceil(stream.s.p / 8)) {
      throw Error('Incomplete or trailing DEFLATE data');
    }
    return join(chunks, size);
  }

  function unzlib(bytes) {
    if (bytes.length < 6 || (bytes[0] & 15) !== 8 || bytes[0] >>> 4 > 7 ||
        (bytes[0] * 256 + bytes[1]) % 31 || bytes[1] & 32) throw Error('Invalid zlib');
    const result = inflate(bytes.subarray(2, -4));
    let a = 1, b = 0;
    for (const byte of result) { a = (a + byte) % 65521; b = (b + a) % 65521; }
    const expected = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(bytes.length - 4);
    if (((b << 16 | a) >>> 0) !== expected) throw Error('Invalid checksum');
    return result;
  }

  function brotli() {
    if (!ready) {
      ready = CopytourlBrotli.default(CopytourlCompression.unzlibSync(
        Uint8Array.from(atob(COPYTOURL_WASM), char => char.charCodeAt(0))
      ));
    }
    return ready;
  }

  async function unbrotli(bytes, limit) {
    await brotli();
    const stream = new CopytourlBrotli.DecompressStream();
    const chunks = [];
    let size = 0, offset = 0;
    try {
      while (true) {
        const result = stream.decompress(bytes.subarray(offset), Math.min(65536, limit - size + 1));
        let chunk, used, code;
        try { chunk = result.buf; used = result.input_offset; code = result.code; }
        finally { result.free(); }
        size += chunk.length;
        offset += used;
        if (size > limit) throw Error('Too much text');
        chunks.push(chunk);
        if (code === CopytourlBrotli.BrotliStreamResultCode.ResultSuccess) {
          if (offset !== bytes.length) throw Error('Trailing Brotli data');
          return join(chunks, size);
        }
        if (code !== CopytourlBrotli.BrotliStreamResultCode.NeedsMoreOutput ||
            (!used && !chunk.length)) throw Error('Incomplete Brotli data');
      }
    } finally { stream.free(); }
  }

  async function encode(text) {
    const bytes = textBytes(text);
    const bytes16 = utf16(text);
    let best = {mode:'t', bytes};
    const consider = (mode, candidate) => {
      if (candidate.length < best.bytes.length) best = {mode, bytes:candidate};
    };
    consider('u', bytes16);
    // One-byte input cannot be shortened. All other candidates use a fixed order.
    if (best.bytes.length > 1) {
      consider('d', CopytourlCompression.zlibSync(bytes, {level:9}).subarray(2, -4));
      consider('f', CopytourlCompression.zlibSync(bytes16, {level:9}).subarray(2, -4));
      await brotli();
      for (const quality of [4, 6, 9, 11]) {
        consider('b', CopytourlBrotli.compress(bytes, {quality}));
        consider('c', CopytourlBrotli.compress(bytes16, {quality}));
      }
    }
    return {hash:'#' + best.mode + '=' + toBase64url(best.bytes), plainSize:3 + Math.ceil(bytes.length * 4 / 3)};
  }

  async function decode(hash) {
    // Every generated payload is no larger than its UTF-8 input.
    if (hash.length > 3 + Math.ceil(MAX_BYTES * 4 / 3)) throw Error('링크가 너무 길어요.');
    const match = /^#([tudfbcz])=([A-Za-z0-9_-]+)$/.exec(hash);
    if (!match) throw Error('링크를 확인해 주세요.');
    try {
      const mode = match[1];
      let bytes = fromBase64url(match[2]);
      const is16 = ['u', 'f', 'c'].includes(mode);
      const limit = is16 ? MAX_BYTES * 2 : MAX_BYTES;
      if (mode === 'z') bytes = unzlib(bytes);
      else if (mode === 'd' || mode === 'f') bytes = inflate(bytes, limit);
      else if (mode === 'b' || mode === 'c') bytes = await unbrotli(bytes, limit);
      const text = (is16 ? decoder16 : decoder).decode(bytes);
      textBytes(text);
      return text;
    } catch { throw Error('링크를 읽을 수 없어요. 전체 주소인지 확인해 주세요.'); }
  }
  return {encode, decode, textBytes, unzlib, fromBase64url};
})();

<script id="app">
(() => {
  const BASE = "https://copytourl.github.io/";
  const RECIPIENT = {"kid":"ef1853219c7df7da","jwk":{"kty":"EC","x":"UDLxJIEAUi9pOB4AOHKMG8fCn_qtz1cEHD9dUvGwlOg","y":"nBh-MMkowZBtiVvwwS6atMTN5TtRPJJDGAJ_2hcer5U","crv":"P-256"}};
  const RECEIVER = /* receiver-key */ null;
  const MAX_BYTES = 1048576;
  const MAX_HASH_LENGTH = 4 + Math.ceil((MAX_BYTES + 90) * 4 / 3);
  const el = id => document.getElementById(id);
  const encoder = new TextEncoder();
  const decoder = new TextDecoder('utf-8', {fatal:true, ignoreBOM:true});
  let received = '', noticeTimer;
  let renderRevision = 0, inputRevision = 0;
  el('download-html').href = BASE + 'copytourl.html';
  el('download-html').hidden = location.protocol === 'file:';

  let workerURL;
  const jobs = new Map();
  function cancelJob(op) {
    const job = jobs.get(op);
    if (job) { job.worker.terminate(); job.reject(Error('Cancelled')); jobs.delete(op); }
  }
  function runCodec(op, value) {
    cancelJob(op);
    if (!workerURL) {
      const code = el('compression-library').textContent + '\n' + el('brotli-library').textContent +
        '\nconst COPYTOURL_WASM = ' + JSON.stringify(el('brotli-data').textContent.trim()) + ';\n' +
        el('codec-library').textContent + `
        onmessage = async ({data}) => {
          try { postMessage({value:await CopytourlCodec[data.op](data.value)}); }
          catch (error) { postMessage({error:error.message}); }
        };`;
      workerURL = URL.createObjectURL(new Blob([code], {type:'text/javascript'}));
    }
    return new Promise((resolve, reject) => {
      const worker = new Worker(workerURL);
      jobs.set(op, {worker, reject});
      const finish = () => { worker.terminate(); if (jobs.get(op)?.worker === worker) jobs.delete(op); };
      worker.onmessage = ({data}) => {
        finish();
        if (data.error) reject(Error(data.error)); else resolve(data.value);
      };
      worker.onerror = () => { finish(); reject(Error('처리하지 못했어요. 최신 브라우저로 열어 주세요.')); };
      worker.postMessage({op, value});
    });
  }

  async function encode(text) {
    const {hash, plainSize} = await runCodec('encode', text);
    return {link:BASE + hash, plainLength:BASE.length + plainSize};
  }

  function suite() {
    if (!globalThis.crypto?.subtle || !RECIPIENT) {
      throw Error('이 브라우저에서는 암호화 링크를 사용할 수 없어요. 최신 브라우저로 열어 주세요.');
    }
    const {CipherSuite, DhkemP256HkdfSha256, HkdfSha256, Aes128Gcm} = CopytourlHPKE;
    return new CipherSuite({kem:new DhkemP256HkdfSha256(), kdf:new HkdfSha256(), aead:new Aes128Gcm()});
  }

  function keyIdBytes() {
    return Uint8Array.from(RECIPIENT.kid.match(/../g), value => parseInt(value, 16));
  }

  function keyInfo(version) { return encoder.encode('copytourl:' + version + ':' + RECIPIENT.kid); }

  function receiverKey() {
    // Only the hosted viewer receives this constant during deployment.
    // Public source and downloadable generator keep it null.
    if (!RECEIVER) throw Error('이전 암호화 링크는 웹페이지에서 열어 주세요.');
    if (RECEIVER.kid !== RECIPIENT.kid || RECEIVER.jwk?.kty !== 'EC' || RECEIVER.jwk.crv !== 'P-256' ||
        RECEIVER.jwk.x !== RECIPIENT.jwk.x || RECEIVER.jwk.y !== RECIPIENT.jwk.y ||
        !/^[A-Za-z0-9_-]{43}$/.test(RECEIVER.jwk.d)) {
      throw Error('페이지를 읽을 수 없어요. 다시 열어 주세요.');
    }
    return RECEIVER.jwk;
  }

  async function decode(hash) {
    if (!hash.startsWith('#e1=')) return runCodec('decode', hash);
    // Decode previously shared encrypted links only. New links never use a key.
    if (hash.length > MAX_HASH_LENGTH) throw Error('링크가 너무 길어요.');
    const jwk = receiverKey();
    try {
      const bytes = CopytourlCodec.fromBase64url(hash.slice(4));
      if (bytes.length <= 90 || !keyIdBytes().every((value, i) => value === bytes[i])) throw Error('Invalid envelope');

      const recipientKey = await cipher.kem.importKey('jwk', jwk, false);
      const payload = new Uint8Array(await cipher.open({
        recipientKey, enc:bytes.slice(8, 73), info:keyInfo('e1')
      }, bytes.slice(73)));

      CopytourlCodec.textBytes(text);
      return text;
    } catch { throw Error('링크를 읽을 수 없어요. 전체 주소인지 확인해 주세요.'); }
  }

  async function render() {
    const revision = ++renderRevision;
    const hash = location.hash;
    cancelJob('decode');
    received = '';
    el('received').textContent = '';
    el('copy-status').textContent = '';
    el('composer').hidden = !!hash;
    el('viewer').hidden = true;
    el('invalid').hidden = true;
    el('loading').hidden = true;
    if (!hash) return;
    el('loading').hidden = false;
    try {
      if (new URLSearchParams(hash.slice(1)).has('text')) {
        throw Error('이전 앱용 링크입니다. 텍스트로 새 링크를 만들어 주세요.');
      }
      const text = await decode(hash);
      if (revision !== renderRevision || hash !== location.hash) return;
      received = text;
      el('received').textContent = received;
      el('viewer').hidden = false;
    } catch (error) {
      if (revision !== renderRevision || hash !== location.hash) return;
      el('invalid-message').textContent = error.message;
      el('invalid').hidden = false;
    } finally {
      if (revision === renderRevision) el('loading').hidden = true;
    }
  }

  el('text').addEventListener('input', () => {
    ++inputRevision;
    cancelJob('encode');
    el('make-link').disabled = false;
    el('result').hidden = true;
    el('link').value = '';
    el('link-size').textContent = '';
    el('length-note').hidden = true;
    el('preview').removeAttribute('href');
    el('form-error').hidden = true;
    el('copy-status').textContent = '';
  });

  el('form').addEventListener('submit', async event => {
    event.preventDefault();
    const revision = ++inputRevision;
    el('make-link').disabled = true;
    el('result').hidden = true;
    el('form-error').hidden = true;
    try {
      const {link, plainLength} = await encode(el('text').value);
      if (revision !== inputRevision) return;
      el('link').value = link;
      el('preview').href = location.protocol === 'file:' ? location.href.split('#')[0] + new URL(link).hash : link;
      const saved = Math.floor((1 - link.length / plainLength) * 100);
      el('link-size').textContent = `링크 ${link.length.toLocaleString('ko-KR')}자` + (saved > 0 ? ` (${saved}% 감소)` : '');
      // A caution threshold, not a guarantee of any messenger's limit.
      el('length-note').hidden = link.length <= 2000;
      el('result').hidden = false;
    } catch (error) {
      if (revision !== inputRevision) return;
      el('result').hidden = true;
      el('form-error').textContent = error.message;
      el('form-error').hidden = false;
    } finally {
      if (revision === inputRevision) el('make-link').disabled = false;
    }
  });

  async function copy(text) {
    clearTimeout(noticeTimer);
    try {
      try { await navigator.clipboard.writeText(text); }
      catch {
        const field = document.createElement('textarea');
        field.value = text;
        field.style.position = 'fixed';
        field.style.opacity = '0';
        document.body.append(field);
        field.focus();field.select();
        try { if (!document.execCommand('copy')) throw Error('Copy failed'); }
        finally { field.remove(); }
      }
      el('copy-status').textContent = '복사했어요.';
      noticeTimer = setTimeout(() => {el('copy-status').textContent = '';}, 1800);
    } catch { el('copy-status').textContent = '복사하지 못했어요. 텍스트를 선택해 복사해 주세요.'; }
  }

  el('copy-link').addEventListener('click', () => copy(el('link').value));
  el('copy-text').addEventListener('click', () => copy(received));
  window.addEventListener('hashchange', render);
  // Re-render on history restoration so the visible text matches the fragment.
  window.addEventListener('pagehide', () => {
    ++renderRevision;
    ++inputRevision;
    cancelJob('encode');
    cancelJob('decode');
    el('make-link').disabled = false;
    received = '';
    el('received').textContent = '';
    el('viewer').hidden = true;
  });
  window.addEventListener('pageshow', event => { if (event.persisted) render(); });
  render();
})();
</script>
